name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "ci@agentscompany.dev"
          git config --global user.name "agents-company-ci"

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          cd packages/control-plane
          mkdir -p .artifacts/unit
          bun run script/check-migrations.ts
          bun test --timeout 30000 \
            test/config/config.test.ts \
            test/company/activity.test.ts \
            test/company-agent/file-bundle.test.ts \
            test/company-project/work-projection.test.ts \
            test/goal-brief/experience-contract.test.ts \
            test/goal-brief/goal-brief.test.ts \
            test/goal-brief/migration.test.ts \
            test/goal-brief/model-adapter.test.ts \
            test/goal-brief/schema.test.ts \
            test/permission-task.test.ts \
            test/plugin/install.test.ts \
            test/server/company-route.test.ts \
            test/server/experience-route.test.ts \
            test/session/auto-dream-default.test.ts \
            test/storage/db-cold-start.test.ts \
            test/util/filesystem.test.ts \
            --reporter=junit \
            --reporter-outfile=.artifacts/unit/junit.xml
          bun run test:r0-branches

      - name: Run shared unit tests
        working-directory: packages/shared
        run: bun test

      - name: Run JavaScript SDK unit tests
        working-directory: packages/sdk/js
        run: bun test

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-junit-report
          path: |
            packages/*/.artifacts/unit/junit.xml
            packages/control-plane/.artifacts/r0-branch-coverage/report.json
          if-no-files-found: warn

  m2-e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "ci@agentscompany.dev"
          git config --global user.name "agents-company-ci"

      - name: Install Chromium
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      - name: Run WebUI unit gate
        working-directory: packages/app
        run: bun run test:unit

      - name: Run R0 runtime config matrix
        working-directory: packages/app
        run: bun run test:r0-config-matrix

      - name: Run committed R0 benchmark twice
        run: |
          bun script/experience-benchmark.ts \
            --ref "$GITHUB_SHA" \
            --gate R0 \
            --all \
            --out "$GITHUB_WORKSPACE/.artifacts/experience-refactor/$GITHUB_SHA" \
            --repeat 2

      - name: Run M2 browser gate
        working-directory: packages/app
        env:
          PLAYWRIGHT_JUNIT_OUTPUT: .artifacts/e2e/junit.xml
        run: |
          mkdir -p .artifacts/e2e
          bun run test:e2e

      - name: Run production browser gate
        working-directory: packages/app
        run: |
          mkdir -p .artifacts/e2e-production
          bun run test:production

      - name: Record incomplete R0 gate decision without automatic or human evidence
        env:
          R0_GATE_DECISION: ${{ github.workspace }}/.artifacts/experience-refactor/${{ github.sha }}/r0-gate-decision.json
        run: |
          bun script/experience-gate.ts \
            --ref "$GITHUB_SHA" \
            --gate R0 \
            --runner-artifact "$GITHUB_WORKSPACE/.artifacts/experience-refactor/$GITHUB_SHA/reproducibility-record.json" \
            --out "$R0_GATE_DECISION"
          bun -e 'const decision = await Bun.file(process.env.R0_GATE_DECISION).json(); if (decision.status !== "incomplete" || decision.automaticEvidenceStatus !== "incomplete" || decision.humanEvidenceStatus !== "incomplete" || !decision.missing.includes("AUTOMATIC-EVIDENCE-PACKAGE")) throw new Error("Unsigned CI gate decision must remain incomplete until exact-SHA automatic and human evidence are supplied.")'

      - name: Upload M2 browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-browser-gate
          path: |
            packages/app/.artifacts/e2e
            packages/app/.artifacts/e2e-production
          if-no-files-found: warn

      - name: Upload R0 benchmark records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0-experience-benchmark
          path: .artifacts/experience-refactor
          if-no-files-found: warn
