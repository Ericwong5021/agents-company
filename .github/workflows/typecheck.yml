name: typecheck

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck shared contracts
        working-directory: packages/shared
        run: bun typecheck

      - name: Typecheck Control Plane
        working-directory: packages/control-plane
        run: bun typecheck

      - name: Typecheck WebUI
        working-directory: packages/app
        run: bun typecheck

      - name: Typecheck JavaScript SDK
        working-directory: packages/sdk/js
        run: bun typecheck

      - name: Verify generated JavaScript SDK is current
        run: |
          ./packages/sdk/js/script/build.ts
          git diff --exit-code -- \
            packages/sdk/openapi.json \
            packages/sdk/js/src/v2/gen
