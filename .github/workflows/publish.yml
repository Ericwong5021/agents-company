name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "publish must run from a vX.Y.Z tag, got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vX.Y.Z, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "AGENTCOMPANY_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "AGENTCOMPANY_CHANNEL=latest" >> "$GITHUB_ENV"

          git fetch origin main --tags --force
          TAG_SHA="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          MAIN_SHA="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/main; then
            echo "tag ${GITHUB_REF_NAME} points to ${TAG_SHA}, which is not on origin/main (${MAIN_SHA})" >&2
            exit 1
          fi

          for workflow in lint typecheck test package-check; do
            conclusion="$(
              gh run list \
                --workflow "${workflow}" \
                --branch main \
                --commit "${TAG_SHA}" \
                --json conclusion,status,databaseId \
                --jq 'map(select(.status == "completed")) | first | .conclusion // ""'
            )"
            if [ "${conclusion}" != "success" ]; then
              echo "required workflow ${workflow} did not succeed for ${TAG_SHA}; conclusion=${conclusion:-missing}" >&2
              exit 1
            fi
          done

          echo "Release ${VERSION} from ${TAG_SHA} passed tag and CI gates."

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install cross-platform native deps
        working-directory: packages/control-plane
        run: |
          WATCHER_VER=$(node -p "require('./package.json').dependencies['@parcel/watcher']")
          bun install --os="*" --cpu="*" "@parcel/watcher@$WATCHER_VER"

      - name: Build all platform binaries
        working-directory: packages/control-plane
        run: bun run script/build.ts --skip-install

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish platform binary packages
        working-directory: packages/control-plane
        run: |
          set -euo pipefail

          for dir in dist/agentcompany-*/; do
            pkg="$(node -p "require('./${dir%/}/package.json').name")"
            if npm view "${pkg}@${AGENTCOMPANY_VERSION}" version >/dev/null 2>&1; then
              echo "Skipping ${pkg}@${AGENTCOMPANY_VERSION}; already published."
              continue
            fi

            echo "Publishing ${pkg}@${AGENTCOMPANY_VERSION}..."
            npm publish "${dir}" --access public --tag latest
          done

      - name: Prepare CLI package
        working-directory: packages/control-plane
        run: bun run script/prepare-npm-package.ts --version "${AGENTCOMPANY_VERSION}"

      - name: Publish CLI package
        working-directory: packages/control-plane/dist/cli
        run: |
          set -euo pipefail

          if npm view "@agents-company/cli@${AGENTCOMPANY_VERSION}" version >/dev/null 2>&1; then
            echo "Skipping @agents-company/cli@${AGENTCOMPANY_VERSION}; already published."
            exit 0
          fi

          npm publish --access public --tag latest
          echo "Published @agents-company/cli@${AGENTCOMPANY_VERSION}"
