name: 发布 CLI 到 npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 版本类型
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 自定义版本号（如 0.2.0，会覆盖版本类型）
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Set release environment
        run: |
          echo "AGENTCOMPANY_CHANNEL=latest" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.version }}" ]; then
            echo "AGENTCOMPANY_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "AGENTCOMPANY_BUMP=${{ inputs.bump }}" >> "$GITHUB_ENV"
          fi

      - name: Install cross-platform native deps
        working-directory: packages/opencode
        run: |
          OTUI_VER=$(node -p "require('./package.json').dependencies['@opentui/core']")
          WATCHER_VER=$(node -p "require('./package.json').dependencies['@parcel/watcher']")
          bun install --os="*" --cpu="*" "@opentui/core@$OTUI_VER"
          bun install --os="*" --cpu="*" "@parcel/watcher@$WATCHER_VER"

      - name: Build all platform binaries
        working-directory: packages/opencode
        run: bun run script/build.ts --skip-install

      - name: Extract built version
        id: version
        working-directory: packages/opencode
        run: |
          VERSION=$(dist/*/bin/agents --version 2>/dev/null || echo "")
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built version: $VERSION"

      - name: List platform packages
        id: platforms
        working-directory: packages/opencode
        run: |
          dirs=()
          for dir in dist/agentcompany-*/; do
            name=$(basename "$dir")
            dirs+=("$name")
          done
          echo "Platform packages: ${dirs[*]}"
          echo "names=${dirs[*]}" >> "$GITHUB_OUTPUT"

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish platform binary packages
        working-directory: packages/opencode
        run: |
          for dir in dist/agentcompany-*/; do
            echo "Publishing $(basename "$dir")..."
            cd "$dir"
            npm publish --access public
            cd -
          done

      - name: Prepare and publish CLI package
        working-directory: packages/opencode
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          PLATFORM_NAMES=""
          for dir in dist/agentcompany-*/; do
            name=$(basename "$dir")
            PLATFORM_NAMES="$PLATFORM_NAMES $name"
          done
          export VERSION
          export PLATFORM_NAMES

          # 创建发布用目录
          mkdir -p dist/cli/bin

          # 复制入口脚本（重命名 .cjs 避免 ESM 模式下的 require 错误）
          cp bin/agents dist/cli/bin/agents.cjs
          chmod +x dist/cli/bin/agents.cjs
          cp postinstall.cjs dist/cli/postinstall.cjs

          # 生成发布用的 package.json
          node <<'NODE'
          const fs = require("fs")
          const platformNames = process.env.PLATFORM_NAMES.trim().split(/\s+/).filter(Boolean).sort()
          if (!platformNames.length) throw new Error("No platform packages found in dist/agentcompany-*")

          fs.writeFileSync(
            "dist/cli/package.json",
            JSON.stringify(
              {
                name: "@agents-company/cli",
                version: process.env.VERSION,
                description: "Agent Company CLI - run an AI company from your terminal",
                type: "commonjs",
                license: "Apache-2.0",
                author: "Agents Company Team",
                homepage: "https://github.com/Ericwong5021/agents-company#readme",
                repository: {
                  type: "git",
                  url: "git+https://github.com/Ericwong5021/agents-company.git",
                  directory: "packages/opencode",
                },
                bugs: {
                  url: "https://github.com/Ericwong5021/agents-company/issues",
                },
                keywords: [
                  "ai",
                  "agent",
                  "agents",
                  "agents-company",
                  "cli",
                  "coding",
                  "developer-tools",
                  "terminal",
                  "tui",
                ],
                bin: {
                  agents: "./bin/agents.cjs",
                },
                scripts: {
                  postinstall: "node postinstall.cjs",
                },
                files: ["bin", "postinstall.cjs", "README.md", "LICENSE"],
                optionalDependencies: Object.fromEntries(
                  platformNames.map((name) => [`@agents-company/${name}`, process.env.VERSION]),
                ),
                publishConfig: {
                  access: "public",
                },
              },
              null,
              2,
            ),
          )
          NODE

          # 复制 README 和 LICENSE
          cp ../../README_npm.md dist/cli/README.md
          cp ../../LICENSE dist/cli/LICENSE

          # 发布前校验 npm 包内容，防止模板 README、错误许可证或缺文件进入 npm
          cd dist/cli
          npm pack --dry-run --json > pack.json
          node <<'NODE'
          const fs = require("fs")

          const pkg = require("./package.json")
          const readme = fs.readFileSync("README.md", "utf8")
          const license = fs.readFileSync("LICENSE", "utf8")
          const pack = JSON.parse(fs.readFileSync("pack.json", "utf8"))[0]
          const files = new Set(pack.files.map((file) => file.path))
          const platformCount = process.env.PLATFORM_NAMES.trim().split(/\s+/).filter(Boolean).length

          function assert(condition, message) {
            if (!condition) throw new Error(message)
          }

          assert(readme.length > 5000, "README.md must be larger than 5KB")
          assert(!/Bun init|bun init/i.test(readme), "README.md still looks like a Bun init template")
          assert(license.includes("Apache License") && license.includes("Version 2.0"), "LICENSE must be Apache License 2.0")
          assert(pkg.description === "Agent Company CLI - run an AI company from your terminal", "description is not release-ready")
          assert(pkg.license === "Apache-2.0", "license field must be Apache-2.0")
          assert(pkg.repository?.url && pkg.repository?.directory, "repository metadata must include url and directory")
          assert(pkg.homepage, "homepage is required")
          assert(pkg.bugs?.url, "bugs.url is required")
          assert(Array.isArray(pkg.keywords) && pkg.keywords.length >= 5, "keywords are required")
          assert(pkg.bin?.agents === "./bin/agents.cjs", "bin.agents must point to ./bin/agents.cjs")
          assert(pkg.scripts?.postinstall === "node postinstall.cjs", "postinstall script is required")
          assert(Object.keys(pkg.optionalDependencies || {}).length === platformCount, "optionalDependencies must match built platform packages")
          assert(files.has("README.md"), "README.md missing from npm pack")
          assert(files.has("LICENSE"), "LICENSE missing from npm pack")
          assert(files.has("bin/agents.cjs"), "bin/agents.cjs missing from npm pack")
          assert(files.has("postinstall.cjs"), "postinstall.cjs missing from npm pack")
          NODE

          # 发布
          npm publish --access public
          echo "Published @agents-company/cli@$VERSION"
